[tool.uv.sources]
torch = { index = "pytorch-cu130" }
flashinfer-jit-cache = { index = "flashinfer-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "flashinfer-cu130"
url = "https://flashinfer.ai/whl/cu130"
explicit = true

[project.scripts]
sharar = "sharar.cli:main"

[tool.setuptools]
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]

[tool.setuptools.packages.find]
include = ["sharar*"]

[tool.setuptools.package-data]
sharar = ["benchmark_data/*.txt"]
"sharar.kernels" = ["csrc/*.cu", "csrc/*.cuh", "csrc/*.cpp"]
"sharar.kernels.qsa" = ["csrc/*.cu", "csrc/LICENSE.*", "LICENSE.vllm", "README.md"]
"sharar.kernels.cute.gdn" = ["LICENSE", "README.md"]
