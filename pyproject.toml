[build-system]
requires = ["setuptools==78.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sharar"
version = "0.0.1"
description = "Thin single-target inference engine: Qwen3.8-27B NVFP4 on one NVIDIA GB10"
readme = "README.md"
requires-python = "==3.12.*"  # the tested interpreter: uv installs and uses a managed 3.12
license = {file = "LICENSE"}
# Exact CPU and GB10 environments are recorded in constraints/.
dependencies = [
  "torch>=2.13,<2.14",
  "numpy>=2.3,<2.4",
  "safetensors>=0.5",
  "tokenizers>=0.21",
  "jinja2>=3.1",
  "fastapi>=0.141,<0.142",
  "uvicorn>=0.52,<0.53",
  "xgrammar==0.2.8",  # constrained output (sharar/engine/grammar.py)
  "huggingface_hub>=1.30",  # model and 3-bit checkpoint downloads
]

[project.optional-dependencies]
test = ["pytest==9.1.1", "httpx==0.28.1"]
eval = ["sharar-eval @ git+https://github.com/abdelfattah-lab/sharar-eval@58ea950577947004861da46b11f62e7c052dc565"]

# The GB10 environment: `uv sync` installs it (uv.lock pins every package; CPU CI uses pip and constraints/cpu.txt).
[dependency-groups]
gb10 = [
  "torch==2.13.0+cu130",
  "flashinfer-python==0.6.17",
  "flashinfer-jit-cache==0.6.17+cu130",
  "b12x==1.5.0",  # Bolt's projections and routed experts (model/bolt/linear.py, kernels/b12x_iq2_moe.py)
  "triton==3.7.1",
  "einops==0.8.2",
  "ninja==1.13.2",  # first-use builds of the CUDA kernels
  "pytest==9.1.1",
  "httpx==0.28.1",
]

[tool.uv]
default-groups = ["gb10"]
environments = ["sys_platform == 'linux' and platform_machine == 'aarch64'"]  # DGX Spark
python-preference = "only-managed"  # a uv-managed Python carries the C headers the first-use kernel builds need
# The tested GB10 versions (constraints/common.txt and gb10-cu130.txt; keep them in step).
constraint-dependencies = [
  "annotated-doc==0.0.5",
  "annotated-types==0.8.0",
  "anyio==4.15.0",
  "apache-tvm-ffi==0.1.13.post3",
  "b12x==1.5.0",
  "certifi==2026.7.22",
  "charset-normalizer==3.5.1",
  "click==8.5.0",
  "cuda-bindings==13.3.1",
  "cuda-core==1.0.1",
  "cuda-pathfinder==1.6.0",
  "cuda-python==13.3.1",
  "cuda-tile==1.5.0",
  "cuda-toolkit==13.0.3.0",
  "einops==0.8.2",
  "fastapi==0.141.1",
  "filelock==3.32.3",
  "flashinfer-jit-cache==0.6.17+cu130",
  "flashinfer-python==0.6.17",
