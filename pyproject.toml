[build-system]
requires = ["setuptools==78.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sharar"
version = "0.0.1"
description = "Thin single-target inference engine: Qwen3.8-27B NVFP4 on one NVIDIA GB10"
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
# Exact CPU and GB10 environments are recorded in constraints/.
dependencies = [
  "torch>=2.13,<2.14",
  "numpy>=2.3,<2.4",
  "safetensors>=0.5",
  "tokenizers>=0.21",
  "jinja2>=3.1",
  "fastapi>=0.141,<0.142",
  "uvicorn>=0.52,<0.53",
]

[project.optional-dependencies]
gpu = ["flashinfer-python==0.6.17", "triton==3.7.1", "einops==0.8.2", "numpy==2.3.5", "packaging==26.3"]
test = ["pytest==9.1.1", "httpx==0.28.1"]
benchmark = ["aiperf==0.12.0"]

[project.scripts]
sharar = "sharar.cli:main"

[tool.setuptools.packages.find]
include = ["sharar*"]

[tool.setuptools.package-data]
sharar = ["benchmark_data/*.txt"]
