name: Model request
description: Ask for a model or checkpoint that Hibana does not serve yet.
labels: ["enhancement"]
body:
  - type: checkboxes
    id: checks
    attributes:
      label: Before you start
      options:
        - label: I searched the existing issues and found no request for this model.
          required: true
  - type: input
    id: checkpoint
    attributes:
      label: Checkpoint
      description: The Hugging Face link to the exact checkpoint, not just the model name.
      placeholder: https://huggingface.co/<org>/<model>
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why this model
      description: What you would use it for, and why the models Hibana serves do not cover it.
    validations:
      required: true
  - type: textarea
    id: fit
    attributes:
      label: Size and format
      description: Parameters (total and active), weight format (NVFP4, FP8, GGUF, ...) and size on disk, so we can see whether it fits one GB10 or needs two. A drafter (MTP head, DFlash2, ...) if it has one.
