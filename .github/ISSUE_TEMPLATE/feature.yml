name: Feature request
description: Suggest a new capability or a change to how Hibana works.
labels: ["enhancement"]
body:
  - type: checkboxes
    id: checks
    attributes:
      label: Before you start
      options:
        - label: I searched the existing issues and found no duplicate.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you would like Hibana to do. Workarounds and alternatives you tried are welcome.
    validations:
      required: true
