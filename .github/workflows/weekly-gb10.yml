name: Weekly GB10
on:
  schedule:
    - cron: '0 2 * * 0'   # Sundays at 02:00 New York time
      timezone: America/New_York
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gb10
  cancel-in-progress: false
jobs:
  weekly:
    if: github.repository == 'abdelfattah-lab/sharar'  # the GB10 runner serves the private repo only; the public copy has none
    runs-on: [self-hosted, gb10]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - name: Python environment, speed and GSM8K/HumanEval of both targets against their baselines
        run: bash tools/ci/gb10.sh venv evaluate
      - name: Stop CI services
        if: always()
        run: bash tools/ci/gb10.sh --cleanup || true
