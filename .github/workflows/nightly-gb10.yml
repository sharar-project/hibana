name: Nightly GB10
on:
  schedule:
    - cron: '0 1 * * *'   # daily at 01:00 New York time
      timezone: America/New_York
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gb10
  cancel-in-progress: false
jobs:
  nightly:
    if: github.repository == 'abdelfattah-lab/sharar'  # the GB10 runner serves the private repo only; the public copy has none
    runs-on: [self-hosted, gb10]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - name: Python environment, GPU suite, serve both targets
        # a scheduled run skips a commit it has already tested; a manual run always tests
        run: >-
          bash tools/ci/gb10.sh ${{ github.event_name == 'schedule' && '--skip-if-tested' || '' }} venv gpu serve
      - name: Stop CI services
        if: always()
        run: bash tools/ci/gb10.sh --cleanup || true
